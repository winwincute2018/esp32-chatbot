name: Auto Build Xiaozhi with Modern UI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract TAR, Inject UI and Prepare Build
        run: python process_tar.py

      - name: Configure and Build for custom_board_28aio
        run: |
          . $IDF_PATH/export.sh
          
          # Tìm thư mục chứa project
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name CMakeLists.txt -exec grep -l "project(" {} + | head -n 1))
          cd $PROJECT_DIR
          
          export BOARD=custom_board_28aio
          idf.py set-target esp32s3
          
          if [ -f "configs/custom_board_28aio.conf" ]; then
             cp configs/custom_board_28aio.conf sdkconfig
          fi
          
          # Thêm cờ -v để xem chi tiết log build nếu lỗi
          idf.py build -v
          
          # Đảm bảo cài đặt esptool
          python -m pip install esptool
          
          # Hợp nhất các tệp bin thành một tệp duy nhất (merged-binary.bin)
          esptool.py --chip esp32s3 merge_bin -o build/merged-binary.bin @build/flasher_args.json

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-custom_board_28aio-modern-ui
          path: |
            **/build/**/*.bin
            **/build/flasher_args.json
            **/build/log/*
