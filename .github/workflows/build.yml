name: Build Xiaozhi AIO28 Modern

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.2
    
    steps:
      - name: Checkout custom board files
        uses: actions/checkout@v4
        with:
          path: custom_board

      - name: Clone Official Xiaozhi Repository
        run: |
          # Tải mã nguồn gốc của Xiaozhi
          git clone --recursive https://github.com/78/xiaozhi-esp32.git xiaozhi-esp32

      - name: Merge Custom Board into Xiaozhi
        run: |
          # Chép đè thư mục main (chứa aio28-modern và modern_ui) của bạn vào mã nguồn gốc
          cp -r custom_board/main xiaozhi-esp32/
          
      - name: Configure and Build
        working-directory: xiaozhi-esp32
        run: |
          . $IDF_PATH/export.sh
          
          # Cấu hình build cho mạch của bạn
          export BOARD=aio28-modern
          idf.py set-target esp32s3
          
          # Áp dụng cấu hình nếu có
          if [ -f "configs/aio28-modern.conf" ]; then
             cp configs/aio28-modern.conf sdkconfig
          fi
          
          # Bắt đầu build
          idf.py build
          
          # Cài đặt esptool và gộp file bin
          python -m pip install esptool
          esptool.py --chip esp32s3 merge_bin -o build/merged-binary.bin @build/flasher_args.json

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-aio28-modern-merged
          path: |
            xiaozhi-esp32/build/merged-binary.bin
            xiaozhi-esp32/build/xiaozhi.bin
            xiaozhi-esp32/build/bootloader/bootloader.bin
            xiaozhi-esp32/build/partition_table/partition-table.bin
