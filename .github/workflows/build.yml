name: Build Xiaozhi AIO28 Modern

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Build Script
        run: python build_script.py

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-aio28-modern-merged
          path: |
            xiaozhi-esp32/build/merged-binary.bin
            xiaozhi-esp32/build/xiaozhi.bin
            xiaozhi-esp32/build/bootloader/bootloader.bin
            xiaozhi-esp32/build/partition_table/partition-table.bin
            xiaozhi-esp32/build/flasher_args.json
